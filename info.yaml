Name: TRACT8
Description: An eight-band Voder - the 1939 Bell Labs talking machine - played by hand from a Music Thing 8mu over USB MIDI Host, one fader per formant band, or from the card's own knobs.
Language: C++ (ComputerCard)
Creator: Andy Jenkinson (uglifruit)
Version: "1.6.0"
Status: Working on hardware
License: MIT
repository: https://github.com/uglifruit/WorkshopTract8
Editor: none
date: 2026-08-28

# TRACT8 is an original implementation after Homer Dudley's Voder (Bell Labs,
# 1939). No code from the original survives - it was relays and vacuum tubes -
# so the debt is conceptual rather than legal.
#
